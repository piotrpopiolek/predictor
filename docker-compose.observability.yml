services:
  worker:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: predictor-worker

  status:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: predictor-status

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel/otel-collector.yml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OBSERVABILITY_BIND_ADDR:-127.0.0.1}:${OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "${OBSERVABILITY_BIND_ADDR:-127.0.0.1}:${OTLP_HTTP_HOST_PORT:-4318}:4318"
    deploy:
      resources:
        limits:
          memory: 384M

  prometheus:
    image: prom/prometheus:v3.4.1
    profiles: ["observability"]
    restart: unless-stopped
    user: "0"
    environment:
      PROMETHEUS_METRICS_TOKEN: ${PROMETHEUS_METRICS_TOKEN:?}
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/prometheus/secrets
        printf '%s' "$$PROMETHEUS_METRICS_TOKEN" > /etc/prometheus/secrets/metrics_token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=30d \
          --web.enable-lifecycle
    ports:
      - "${OBSERVABILITY_BIND_ADDR:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9090}:9090"
    deploy:
      resources:
        limits:
          memory: 512M

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?}
    volumes:
      - ./deploy/alertmanager/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - ./deploy/alertmanager/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports:
      - "${OBSERVABILITY_BIND_ADDR:-127.0.0.1}:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    deploy:
      resources:
        limits:
          memory: 128M

  loki:
    image: grafana/loki:3.5.1
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./deploy/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "${OBSERVABILITY_BIND_ADDR:-127.0.0.1}:3100:3100"
    deploy:
      resources:
        limits:
          memory: 384M

  tempo:
    image: grafana/tempo:2.8.1
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    environment:
      GOMEMLIMIT: 700MiB
    volumes:
      - ./deploy/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "${OBSERVABILITY_BIND_ADDR:-127.0.0.1}:3200:3200"
    deploy:
      resources:
        limits:
          memory: 768M

  grafana:
    image: grafana/grafana:11.6.3
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:${GRAFANA_HOST_PORT:-3000}
      PREDICTOR_METRICS_DB: ${PREDICTOR_METRICS_DB:-predictor_prod}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${OBSERVABILITY_BIND_ADDR:-127.0.0.1}:${GRAFANA_HOST_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          memory: 256M

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: ["observability"]
    restart: unless-stopped
    pid: host
    volumes:
      # No rslave: Docker Desktop's Linux VM rejects shared/slave bind propagation.
      - /:/host:ro
      - predictor_pgdumps:/textfile:ro
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    deploy:
      resources:
        limits:
          memory: 64M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    profiles: ["observability"]
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    deploy:
      resources:
        limits:
          memory: 192M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:${POSTGRES_SUPERUSER_PASSWORD:?}@postgres:5432/predictor_prod?sslmode=disable
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  predictor_pgdumps:
